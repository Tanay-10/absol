[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "extraction-normalization"
version = "0.1.0"
description = "Hackathon: multi-hazard event extraction and normalization pipeline"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "httpx>=0.27,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.22,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/extraction_normalization"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
